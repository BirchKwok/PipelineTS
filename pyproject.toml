[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PipelineTS"
version = "1.3.0"
description = "One-stop time series analysis tool, supporting time series data preprocessing, feature engineering, model training, model evaluation, model prediction, etc. Based on spinesTS."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["time series", "forecasting"]
authors = [
    {name = "Birch Kwok", email = "birchkwok@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "matplotlib>=3.7.1",
    "numpy>=1.24.3",
    "pandas>=2.0.3",
    "scikit-learn>=1.3.0",
    "frozendict>=2.3.0",
    "spinesUtils[all]>=0.3.13",
    "tabulate>=0.8.9",
    "cloudpickle>=2.2.1",
    "scipy>=1.7.3",
    "flask>=2.0",
    "apexbase>=1.16.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
torch = ["torch>=1.8.0"]
mlx = ["mlx>=0.20.0; platform_system == 'Darwin' and platform_machine == 'arm64'"]
nn = ["torch>=1.8.0", "mlx>=0.20.0; platform_system == 'Darwin' and platform_machine == 'arm64'"]
all = ["openai>=1.0", "anthropic>=0.30", "torch>=1.8.0", "mlx>=0.20.0; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
pipelinets = "PipelineTS.agent.cli:main"

[project.urls]
Homepage = "https://github.com/BirchKwok/PipelineTS"
Repository = "https://github.com/BirchKwok/PipelineTS"

[tool.setuptools.packages.find]
include = ["PipelineTS*"]

[tool.setuptools.package-data]
"PipelineTS.spinesTS.data" = ["built-in-datasets/*.csv", "built-in-datasets/*.yaml"]
